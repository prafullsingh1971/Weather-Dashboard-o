<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for proper text display -->
    <meta charset="UTF-8">
    <!-- Ensures proper rendering on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page title shown in browser tab -->
    <title>Real-Time Weather Dashboard</title>
    <!-- Link to external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons (CDN link) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main container that holds everything -->
    <div class="container">
        <!-- Header section with title and theme toggle -->
        <header class="header">
            <div class="header-left">
                <!-- Weather icon in header -->
                <i class="fas fa-cloud-sun header-icon"></i>
                <!-- Main title -->
                <h1>Weather Dashboard</h1>
            </div>
            <div class="header-right">
                <!-- Dark/Light mode toggle button -->
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Search section -->
        <section class="search-section">
            <!-- Search input field -->
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter city name..." 
                    class="search-input"
                    aria-label="Search for city"
                >
                <!-- Search button -->
                <button id="searchBtn" class="search-btn" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <!-- Action buttons row -->
            <div class="action-buttons">
                <!-- Get current location button -->
                <button id="locationBtn" class="action-btn">
                    <i class="fas fa-map-marker-alt"></i> Current Location
                </button>
                <!-- Refresh button -->
                <button id="refreshBtn" class="action-btn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <!-- Temperature unit toggle -->
            <div class="unit-toggle-container">
                <span>Unit:</span>
                <button id="unitToggle" class="unit-btn">°C</button>
            </div>
            <!-- Search history section -->
            <div id="searchHistory" class="search-history">
                <!-- Search history items will be dynamically added here -->
            </div>
        </section>

        <!-- Loading animation (hidden by default) -->
        <div id="loading" class="loading-container" style="display: none;">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Error message (hidden by default) -->
        <div id="errorMessage" class="error-message" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">City not found. Please try again.</span>
        </div>

        <!-- Main weather display section -->
        <main id="weatherDisplay" class="weather-display" style="display: none;">
            <!-- Current weather card -->
            <section class="current-weather card">
                <div class="weather-header">
                    <!-- City and country name -->
                    <h2 id="cityName">City, Country</h2>
                    <!-- Current date and time -->
                    <p id="currentDateTime" class="datetime">Date & Time</p>
                </div>
                <div class="weather-main">
                    <!-- Weather icon -->
                    <div class="weather-icon">
                        <img id="weatherIcon" src="" alt="Weather icon">
                    </div>
                    <!-- Temperature display -->
                    <div class="temperature">
                        <span id="temperature">--</span>
                        <span class="unit-symbol">°C</span>
                    </div>
                    <!-- Weather description -->
                    <p id="weatherDescription" class="description">Description</p>
                </div>
                <!-- Weather details grid -->
                <div class="weather-details">
                    <div class="detail-item">
                        <i class="fas fa-tint"></i>
                        <span>Humidity</span>
                        <span id="humidity" class="detail-value">--%</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <span>Wind Speed</span>
                        <span id="windSpeed" class="detail-value">-- km/h</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-compress-alt"></i>
                        <span>Pressure</span>
                        <span id="pressure" class="detail-value">-- hPa</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-eye"></i>
                        <span>Visibility</span>
                        <span id="visibility" class="detail-value">-- km</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-sun"></i>
                        <span>Sunrise</span>
                        <span id="sunrise" class="detail-value">--:--</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-moon"></i>
                        <span>Sunset</span>
                        <span id="sunset" class="detail-value">--:--</span>
                    </div>
                </div>
            </section>

            <!-- 5-Day Forecast section -->
            <section class="forecast-section">
                <h3><i class="fas fa-calendar-alt"></i> 5-Day Forecast</h3>
                <div id="forecastContainer" class="forecast-container">
                    <!-- Forecast cards will be dynamically generated -->
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2024 Weather Dashboard | Powered by OpenWeatherMap API</p>
        </footer>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
